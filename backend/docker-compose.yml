version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: betmines_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betmines_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: betmines_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: betmines_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/betmines_db?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
